<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronómetro de Trabalenguas</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            width: 120px;
            margin-bottom: 20px;
        }

        h1 {
            color: #4CAF50;
            font-size: 2em;
            margin-bottom: 20px;
        }

        label {
            font-size: 1.2em;
            margin-bottom: 10px;
            display: block;
            color: #333;
        }

        input {
            padding: 10px;
            width: 80%;
            font-size: 1.1em;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            margin: 10px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s;
        }

        button:disabled {
            background-color: #ccc;
        }

        button:hover {
            background-color: #45a049;
        }

        p {
            font-size: 1.5em;
            margin-top: 20px;
            font-weight: bold;
            color: #333;
        }

        .resultado {
            margin-top: 30px;
            text-align: left;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .resultado h2 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        ul li {
            font-size: 1.1em;
            color: #4CAF50;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Logo del colegio" class="logo">
        <h1>Cronómetro de Trabalenguas</h1>

        <label for="nombre">Nombre: </label>
        <input type="text" id="nombre" placeholder="Ingresa tu nombre">
        <br>

        <button onclick="iniciarCronometro()">Iniciar Cronómetro</button>
        <button onclick="detenerCronometro()" disabled>Detener Cronómetro</button>

        <p id="tiempo">0.00</p>

        <div class="resultado">
            <h2>Mejores Tiempos</h2>
            <ul id="listaResultados"></ul>
        </div>
    </div>

    <script>
        let tiempoInicio;
        let cronometroActivo = false;
        const listaResultados = [];

        function iniciarCronometro() {
            const nombre = document.getElementById('nombre').value;
            if (!nombre) {
                alert("Por favor, ingresa tu nombre.");
                return;
            }

            cronometroActivo = true;
            document.querySelector('button[onclick="detenerCronometro()"]').disabled = false;
            tiempoInicio = Date.now();
            document.getElementById('tiempo').textContent = "0.00";

            let intervalo = setInterval(() => {
                if (!cronometroActivo) clearInterval(intervalo);
                const tiempoTranscurrido = (Date.now() - tiempoInicio) / 1000;
                document.getElementById('tiempo').textContent = tiempoTranscurrido.toFixed(2);
            }, 10);
        }

        function detenerCronometro() {
            cronometroActivo = false;
            const nombre = document.getElementById('nombre').value;
            const tiempoFinal = (Date.now() - tiempoInicio) / 1000;
            listaResultados.push({ nombre, tiempo: tiempoFinal });
            listaResultados.sort((a, b) => a.tiempo - b.tiempo);

            document.getElementById('listaResultados').innerHTML = listaResultados.map(resultado => 
                `<li>${resultado.nombre}: ${resultado.tiempo.toFixed(2)} segundos</li>`
            ).join("");

            document.querySelector('button[onclick="detenerCronometro()"]').disabled = true;
        }
    </script>

</body>
</html>
